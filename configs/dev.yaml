# LogAgent-RCA development configuration (pilot calibration happens on dev families only).
# Relative paths resolve against the working directory (run from the repository root).
config_version: "1"

data:
  cases_dir: data/synthetic/dev/cases      # agent-accessible case bundles
  truth_dir: data/synthetic/dev/truth      # ground truth, never passed to any arm
  sums_file: data/synthetic/dev/SHA256SUMS
  sums_sha256: 7aaf93223775309a780a8b73ddccef5ffdbc8c10a617ae0eeec2190161e1a8e1

experiment:
  name: dev-pilot
  split: dev
  arms: [E1, E2b, E3, A2, A3]
  repeats: 1
  base_seed: 1000
  output_dir: results/dev-pilot

llm:
  model: qwen3:8b
  base_url: http://127.0.0.1:11434
  num_ctx: 8192
  num_predict: 450
  timeout_s: 2400
  temperature: 0.2          # shared by all LLM arms (Q-007; confirm in pilot)
  think: false

budget:
  evidence_token_budget: 3000   # B: DEVELOPMENT PLACEHOLDER; strict unique-evidence-token budget; set after pilot
  prompt_overhead_tokens: 1500
  token_counter: hf_tokenizer
  tokenizer_file: models/qwen3-tokenizer.json
  tokenizer_sha256: aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4
  tokenizer_source: https://huggingface.co/Qwen/Qwen3-8B/resolve/b968826d9c46dd6066d109eabc6255188de91218/tokenizer.json
  tokenizers_version: "0.23.3"

agent:
  max_steps: 6
  min_tool_calls: 2
  coverage_gate: true
  lookback_s: 600

validator:
  enabled: true
