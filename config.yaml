# AgentRCA configuration (paths are relative to the working directory; works on Windows and Linux)
logs:
  root: data/demo
  include: ["*.log"]
agent:
  max_steps: 8
  min_tool_calls: 2
  lookback_s: 600
  coverage_gate: true      # ablation switch
  validate: true           # ablation switch (evidence-grounding enforcement)
llm:
  backend: ollama
  base_url: http://127.0.0.1:11434
  model: qwen3:8b
  num_ctx: 8192
  temperature: 0
  seed: 42
  think: false
rules_file: rules.yaml
output_dir: runs
